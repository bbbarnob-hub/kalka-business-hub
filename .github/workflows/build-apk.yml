name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la app/build/outputs/apk/debug/ || true
          cp "$APK" ./app.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ./app.apk \
            --title "KALKA BUSINESS HUB — latest APK" \
            --notes "Built automatically by APPZY from commit ${GITHUB_SHA:0:7}" \
            --latest
